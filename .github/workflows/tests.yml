name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sparkainlp-x/digital-to-wave-cseq
          ref: ad8ea3af7d1ced04b4ec01a8768a1a7619190d4b
          path: _cseq
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools (claims_layer itself needs only the standard library)
        run: python -m pip install -r requirements-dev.txt numpy
      - name: pytest (warnings are errors)
        env:
          CSEQ_DIR: ${{ github.workspace }}/_cseq
        run: python -m pytest -q
      - name: Legacy script tests
        run: python tests.py
      - name: Self-contained demo (no numpy needed)
        run: python -I -c "import runpy,sys; sys.path.insert(0,'.'); sys.argv=['demo.py']; runpy.run_path('demo.py', run_name='__main__')"
      - name: cseq_wave demo (numpy is needed by digital-to-wave-cseq only)
        env:
          CSEQ_DIR: ${{ github.workspace }}/_cseq
        run: python demo_cseq.py
